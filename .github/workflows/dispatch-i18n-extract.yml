name: Dispatch i18n Extraction

# Asks the I18n repository to re-extract localizable strings from this
# commit. See FrankerFaceZ/I18n .github/workflows/extract.yml.

on:
  push:
    branches:
      - master

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to I18n Repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_I18N_PAT }}
          repository: FrankerFaceZ/I18n
          event-type: extract-core
          client-payload: |-
            {
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}"
            }
