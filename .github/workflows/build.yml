name: Build Main Client

on:
  push:
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.deploy-check.outputs.can_deploy }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Use Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    - name: Install Dependencies
      run: bun install --frozen-lockfile

    # Lint carries an inherited baseline of several hundred findings, so it
    # reports without blocking until that is cleared. Typecheck is clean and
    # blocks.
    - name: Lint (non-blocking)
      run: bun run eslint
      continue-on-error: true

    - name: Typecheck
      run: bun run typecheck

    - name: Run Tests
      run: bun run test

    # Set the FFZ_CLIENT_HOST repository variable to build a client that
    # loads from your own host; leave it unset for the default CDN.
    - name: Build the Client
      run: bun run build
      env:
        FFZ_CLIENT_HOST: ${{ vars.FFZ_CLIENT_HOST }}

    - name: Upload Archive
      uses: actions/upload-artifact@v5
      with:
        name: client
        path: dist

    # Deploy needs the HOST, SSH_USERNAME and SSH_PRIVATE_KEY secrets.
    # Secrets are not readable from a job's `if`, so decide here.
    - name: Check Deploy Secrets
      id: deploy-check
      env:
        HOST: ${{ secrets.HOST }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        if [ -n "$HOST" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
          echo "can_deploy=true" >> "$GITHUB_OUTPUT"
        else
          echo "can_deploy=false" >> "$GITHUB_OUTPUT"
          echo "Deploy secrets are not configured; skipping deploy."
        fi

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.build.outputs.can_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Download Archive
      uses: actions/download-artifact@v5
      with:
        name: client
        path: dist

    - name: Deploy (Clean)
      uses: garygrossgarten/github-action-ssh@release
      with:
        command: $HOME/clean-client.sh
        host: ${{ secrets.HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        privateKey: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy (Copy)
      uses: appleboy/scp-action@v0.1.7
      with:
        source: dist
        target: client
        strip_components: 1
        host: ${{ secrets.HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy (Execute)
      uses: garygrossgarten/github-action-ssh@release
      with:
        command: $HOME/update-client.sh
        host: ${{ secrets.HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        privateKey: ${{ secrets.SSH_PRIVATE_KEY }}
