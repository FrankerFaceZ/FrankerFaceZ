name: Build Main Client

on:
  push:
  pull_request:

# A newer push to the same branch supersedes an in-flight run, except on
# master, whose runs deploy and must finish: a queued duplicate once got
# GitHub to cancel the deploying run instead.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.deploy-check.outputs.can_deploy }}
      can_deploy_pages: ${{ steps.deploy-check.outputs.can_deploy_pages }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Use Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    - name: Install Dependencies
      run: bun install --frozen-lockfile

    - name: Lint
      run: bun run eslint

    - name: Typecheck
      run: bun run typecheck

    - name: Run Tests
      run: bun run test

    # Set the FFZ_CLIENT_HOST repository variable to build a client that
    # loads from your own host; leave it unset for the default CDN.
    - name: Build the Client
      run: bun run build
      env:
        FFZ_CLIENT_HOST: ${{ vars.FFZ_CLIENT_HOST }}

    - name: Upload Archive
      uses: actions/upload-artifact@v7
      with:
        name: client
        path: dist

    # The same build laid out for a static host (see tools/layout-site.js).
    - name: Lay Out Static Site
      run: bun run layout:site

    - name: Upload Static Site
      uses: actions/upload-artifact@v7
      with:
        name: site
        path: site

    # The SSH deploy needs the HOST, SSH_USERNAME and SSH_PRIVATE_KEY
    # secrets; the Cloudflare Pages deploy needs CLOUDFLARE_API_TOKEN and
    # CLOUDFLARE_ACCOUNT_ID plus the CLOUDFLARE_PAGES_PROJECT variable.
    # Secrets are not readable from a job's `if`, so decide here.
    - name: Check Deploy Secrets
      id: deploy-check
      env:
        HOST: ${{ secrets.HOST }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      run: |
        if [ -n "$HOST" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
          echo "can_deploy=true" >> "$GITHUB_OUTPUT"
        else
          echo "can_deploy=false" >> "$GITHUB_OUTPUT"
          echo "SSH deploy secrets are not configured; skipping that deploy."
        fi
        if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_PAGES_PROJECT" ]; then
          echo "can_deploy_pages=true" >> "$GITHUB_OUTPUT"
        else
          echo "can_deploy_pages=false" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages settings are not configured; skipping that deploy."
        fi

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.build.outputs.can_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Download Archive
      uses: actions/download-artifact@v8
      with:
        name: client
        path: dist

    - name: Deploy (Clean)
      uses: garygrossgarten/github-action-ssh@release
      with:
        command: $HOME/clean-client.sh
        host: ${{ secrets.HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        privateKey: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy (Copy)
      uses: appleboy/scp-action@v1.0.0
      with:
        source: dist
        target: client
        strip_components: 1
        host: ${{ secrets.HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy (Execute)
      uses: garygrossgarten/github-action-ssh@release
      with:
        command: $HOME/update-client.sh
        host: ${{ secrets.HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        privateKey: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-pages:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.build.outputs.can_deploy_pages == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Download Static Site
      uses: actions/download-artifact@v8
      with:
        name: site
        path: site

    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=master --commit-dirty=true
