name: Build Main Client

on:
  push:
    branches:
    - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Uses PNPM
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Uses Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install

    - name: Build the Client
      run: pnpm build

    - name: Create Archive
      id: artifact-upload-setp
      uses: actions/upload-artifact@v4
      with:
        name: client
        path: |
          dist

    - name: Deploy (Clean)
      uses: garygrossgarten/github-action-ssh@release
      with:
        command: $HOME/clean-client.sh
        host: ${{ secrets.HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        privateKey: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy (Copy)
      uses: appleboy/scp-action@v0.1.7
      with:
        source: dist
        target: client
        strip_components: 1
        host: ${{ secrets.HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy (Execute)
      uses: garygrossgarten/github-action-ssh@release
      with:
        command:  $HOME/update-client.sh
        host: ${{ secrets.HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        privateKey: ${{ secrets.SSH_PRIVATE_KEY }}

  # The new server.
  deploy-new-server:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-new-server
      cancel-in-progress: false
    steps:
    - name: Download the Build
      uses: actions/download-artifact@v4
      with:
        name: client
        path: dist

    - name: Deploy
      env:
        DEPLOY_HOST: ${{ secrets.FFZ_DEPLOY_HOST }}
        DEPLOY_KEY: ${{ secrets.FFZ_DEPLOY_KEY }}
        DEPLOY_KNOWN_HOSTS: ${{ secrets.FFZ_DEPLOY_KNOWN_HOSTS }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ffz_deploy
        chmod 600 ~/.ssh/ffz_deploy
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        tar -czf - -C dist . | ssh -i ~/.ssh/ffz_deploy -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=yes -o BatchMode=yes \
          "githubci@$DEPLOY_HOST" deploy client
